<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glossary — Table Ready</title>
<meta name="description" content="Every term from Blackjack, Baccarat, Pai Gow Poker, and Ultimate Texas Hold'em, explained in one line each — soft 17, commission, the third-card rule, and everything in between.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" href="/favicon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Table Ready">
<meta property="og:title" content="Glossary — Table Ready">
<meta property="og:description" content="Every term from Blackjack, Baccarat, Pai Gow Poker, and Ultimate Texas Hold'em, explained in one line each.">
<meta property="og:url" content="https://tableready.xyz/learn/glossary/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
@view-transition { navigation: auto; }
:root{
  --felt:#0C0D10; --felt-dark:#08090B; --panel:#15171B; --panel-2:#1D2025;
  --brass:#D6A94B; --brass-bright:#F0C46B;
  --coral:#E15D45; --sage-bright:#65C7A3; --dusty-blue:#5B8DE0; --violet:#9C82E0;
  --text:#EDEEF0; --text-muted:#8A8F98; --line:rgba(237,238,240,0.09);
}
*{box-sizing:border-box;}
:focus-visible{outline:2px solid var(--brass-bright);outline-offset:3px;border-radius:4px;}
body{margin:0;background:var(--felt-dark);color:var(--text);font-family:'Inter',sans-serif;}
a{color:inherit;}
::selection{background:rgba(214,169,75,0.3);}

.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:16px 24px;background:rgba(8,9,11,0.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
.topbar .brand{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;text-decoration:none;display:flex;align-items:center;gap:8px;}
.topbar .links{display:flex;gap:18px;align-items:center;}
.topbar a.nav-link{font-size:13px;color:var(--text-muted);text-decoration:none;}
.topbar a.nav-link:hover{color:var(--text);}

.hero{max-width:640px;margin:0 auto;padding:64px 24px 24px;text-align:center;position:relative;}
.hero-glow{position:absolute;top:-100px;left:50%;transform:translateX(-50%);width:560px;height:360px;background:radial-gradient(ellipse,rgba(214,169,75,0.14) 0%,rgba(214,169,75,0) 68%);pointer-events:none;z-index:0;}
.eyebrow{font-family:'Space Grotesk',sans-serif;font-size:11.5px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;color:var(--brass-bright);margin:0 0 16px;position:relative;z-index:1;}
.hero h1{font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:clamp(28px,5vw,40px);margin:0 0 12px;letter-spacing:-0.5px;position:relative;z-index:1;}
.hero p{font-size:15px;color:var(--text-muted);line-height:1.6;margin:0;position:relative;z-index:1;}

.search-wrap{max-width:440px;margin:28px auto 0;padding:0 24px;position:relative;z-index:1;}
.search-input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:14px;color:var(--text);font-family:'Inter',sans-serif;}
.search-input::placeholder{color:var(--text-muted);}
.search-input:focus{outline:none;border-color:rgba(240,196,107,0.4);}

.filter-row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:20px 24px 8px;}
.filter-btn{background:var(--panel);border:1px solid var(--line);color:var(--text-muted);font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:12.5px;padding:7px 16px;border-radius:999px;cursor:pointer;transition:all 160ms ease;}
.filter-btn.active{background:var(--brass);color:#1A1408;border-color:var(--brass);}
.filter-btn:not(.active):hover{border-color:rgba(240,196,107,0.35);color:var(--text);}

.glossary{max-width:840px;margin:0 auto;padding:24px 24px 80px;}
.term-section{margin-bottom:8px;}
.term-section-label{font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:700;color:var(--brass);letter-spacing:1.3px;text-transform:uppercase;margin:36px 0 14px;padding-top:8px;border-top:1px solid var(--line);}
.term-section-label:first-child{margin-top:0;border-top:none;padding-top:0;}
.term-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;}
.term-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;}
.term-card.hidden{display:none;}
.term-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14.5px;color:var(--text);margin:0 0 5px;display:flex;align-items:center;gap:7px;}
.term-tag{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;padding:2px 7px;border-radius:5px;}
.term-tag.bj{background:rgba(91,141,224,0.15);color:var(--dusty-blue);}
.term-tag.bc{background:rgba(101,199,163,0.15);color:var(--sage-bright);}
.term-tag.uth{background:rgba(156,130,224,0.15);color:var(--violet);}
.term-tag.pg{background:rgba(225,93,69,0.15);color:var(--coral);}
.term-tag.gen{background:rgba(214,169,75,0.15);color:var(--brass-bright);}
.term-def{font-size:13.5px;color:var(--text-muted);line-height:1.55;margin:0;}
.no-results{text-align:center;color:var(--text-muted);font-size:14px;padding:40px 24px;display:none;}

footer{text-align:center;padding:20px 24px 60px;font-size:12px;color:var(--text-muted);}
</style>
</head>
<body>

<div class="topbar">
  <a href="/" class="brand">Table Ready</a>
  <div class="links">
    <a href="/learn/" class="nav-link">Learn to play</a>
    <a href="/" class="nav-link">&larr; Back to the floor</a>
  </div>
</div>

<section class="hero">
  <div class="hero-glow"></div>
  <p class="eyebrow">Reference</p>
  <h1>The glossary</h1>
  <p>Every term from all four games, in one line each. Search, or filter by table.</p>
  <div class="search-wrap">
    <input type="text" class="search-input" id="search" placeholder="Search a term, like &quot;soft 17&quot; or &quot;commission&quot;" aria-label="Search the glossary">
  </div>
</section>

<div class="filter-row" id="filter-row">
  <button class="filter-btn active" data-filter="all">All terms</button>
  <button class="filter-btn" data-filter="bj">Blackjack</button>
  <button class="filter-btn" data-filter="bc">Baccarat</button>
  <button class="filter-btn" data-filter="pg">Pai Gow</button>
  <button class="filter-btn" data-filter="uth">Hold'em</button>
  <button class="filter-btn" data-filter="gen">General</button>
</div>

<div class="glossary" id="glossary"></div>
<p class="no-results" id="no-results">No terms match that search.</p>

<footer>For education only — a free practice table, not real-money gambling.</footer>

<script>
var TERMS = [
  {tag:'gen', name:'House edge', def:'The casino\u2019s built-in mathematical advantage on a bet, expressed as a percentage of what you wager.'},
  {tag:'gen', name:'Bankroll', def:'The pool of chips you\u2019re playing with. On this site it\u2019s shared across every table.'},
  {tag:'gen', name:'Push', def:'A tie. Your original bet is returned \u2014 no win, no loss.'},
  {tag:'gen', name:'Shoe', def:'The stack of shuffled decks the cards are dealt from.'},

  {tag:'bj', name:'Soft 17', def:'A hand where an Ace counts as 11 and the total is 17, like Ace+6. In this game, the dealer stands on soft 17.'},
  {tag:'bj', name:'Hard hand', def:'A hand with no Ace, or where the Ace can only count as 1 without busting.'},
  {tag:'bj', name:'Hit', def:'Take another card.'},
  {tag:'bj', name:'Stand', def:'Stop taking cards and lock in your total.'},
  {tag:'bj', name:'Double down', def:'Double your bet in exchange for exactly one more card, then stand.'},
  {tag:'bj', name:'Split', def:'If your first two cards match, separate them into two hands, each with its own bet.'},
  {tag:'bj', name:'Insurance', def:'A side bet offered when the dealer shows an Ace, betting that their hidden card gives them blackjack.'},
  {tag:'bj', name:'Blackjack (natural)', def:'An Ace plus a 10-value card on your first two cards. Pays 3 to 2, better than an ordinary win.'},
  {tag:'bj', name:'Bust', def:'Going over 21. You lose immediately, even if the dealer busts too afterward.'},
  {tag:'bj', name:'Running count', def:'A card-counting total that goes up for low cards seen and down for high cards seen, tracking the shoe as you go.'},
  {tag:'bj', name:'True count', def:'The running count adjusted for how many decks are left, giving a fairer read on how favorable the remaining shoe is.'},
  {tag:'bj', name:'Penetration', def:'How far into the shoe the dealer deals before shuffling again. Deeper penetration matters more to card counters.'},

  {tag:'bc', name:'Banker / Player', def:'The two hands you bet on. You\u2019re not playing either hand yourself \u2014 fixed rules decide everything.'},
  {tag:'bc', name:'Natural', def:'An 8 or 9 on the first two cards. The hand ends immediately \u2014 nobody draws a third card.'},
  {tag:'bc', name:'Commission', def:'A 5% fee taken from Banker wins in the traditional version of the game, since Banker wins slightly more often.'},
  {tag:'bc', name:'Third-card rule', def:'The fixed rule deciding whether Banker or Player draws a third card. No decisions involved \u2014 it\u2019s automatic.'},
  {tag:'bc', name:'Dragon 7', def:'A side bet that pays 40 to 1 if Banker wins with exactly a 3-card total of 7.'},
  {tag:'bc', name:'Panda 8', def:'A side bet that pays 25 to 1 if Player wins with exactly a 3-card total of 8.'},
  {tag:'bc', name:'Dragon Bonus', def:'A side bet on Player or Banker winning by a wide margin, or with a natural. Bigger margins pay more.'},
  {tag:'bc', name:'Big Road', def:'A grid tracking the pattern of past hands, where streaks of the same winner stack down a column.'},
  {tag:'bc', name:'Bead Plate', def:'The simplest way to track past hands \u2014 one dot per hand, in the order they happened.'},
  {tag:'bc', name:'Squeeze', def:'A tradition at bigger tables where the player with the largest bet slowly reveals their own cards. Not done at mini-baccarat.'},

  {tag:'pg', name:'High hand / Low hand', def:'Your seven cards split into a five-card hand and a two-card hand. Both have to beat the dealer\\u2019s corresponding hand to win.'},
  {tag:'pg', name:'Setting the hand', def:'Deciding how to split your seven cards into high and low. Once confirmed, it can\\u2019t be changed.'},
  {tag:'pg', name:'Foul', def:'Setting your low hand stronger than your high hand. An automatic loss, no matter how good the cards were.'},
  {tag:'pg', name:'Joker', def:'The one wild card in the deck \\u2014 but only semi-wild. It plays as an Ace, or completes a straight or flush. It can never just become a matching card to make a pair.'},
  {tag:'pg', name:'House way', def:'A fixed set of rules for splitting a hand, used by the dealer and offered as an optional auto-set for players.'},
  {tag:'pg', name:'Banker copy', def:'An exact tie between your hand and the dealer\\u2019s. Unlike most games, the tie goes to the dealer \\u2014 you lose.'},
  {tag:'pg', name:'Ace-High Pai Gow', def:'When the dealer\\u2019s best possible hand is just an Ace on top with no pair anywhere. Your Ante pushes automatically, no matter what you were dealt.'},
  {tag:'pg', name:'Fortune Bonus', def:'An optional side bet on your own seven cards alone, paying out on a strong hand regardless of whether you beat the dealer.'},
  {tag:'pg', name:'Ace-High bonus', def:'An optional side bet that pays when the dealer is forced into an Ace-High Pai Gow.'},
  {tag:'pg', name:'Commission-free', def:'This variant doesn\\u2019t take a cut out of winning bets, unlike some Pai Gow tables that charge 5% on wins.'},

  {tag:'uth', name:'Ante / Blind', def:'Two mandatory, equal bets placed before any cards are dealt. Blind only pays extra on a straight or better; otherwise it just pushes.'},
  {tag:'uth', name:'Play bet', def:'Your one raise of the hand, sized 4x the Ante pre-flop, 2x after the flop, or 1x at the river. Once placed, no more community cards change your decision.'},
  {tag:'uth', name:'Trips', def:'An optional side bet on your own final five-card hand alone, win or lose against the dealer \u2014 it even pays if you fold the main hand.'},
  {tag:'uth', name:'Qualify', def:'The dealer needs at least a pair to \u201cqualify.\u201d If they don\u2019t, your Ante pushes no matter who actually wins the hand.'},
  {tag:'uth', name:'Hidden pair', def:'A pair made using at least one of your own hole cards, so the dealer can\u2019t see it forming on the board the way an obvious board pair would.'},
  {tag:'uth', name:'Board', def:'The five shared community cards \u2014 three at the flop, then two more at the turn and river \u2014 that both you and the dealer can use.'},
  {tag:'uth', name:'Qualifying hand (dealer outs)', def:'At the river, the number of possible dealer hole cards that would beat you. Fewer outs favors betting; more favors folding.'}
];

var termCardEntries = [];
var sectionEntries = [];

function renderGlossary(){
  var container = document.getElementById('glossary');
  container.innerHTML = '';
  var sections = [
    {key:'gen', label:'General'},
    {key:'bj', label:'Blackjack'},
    {key:'bc', label:'Baccarat'},
    {key:'pg', label:'Pai Gow Poker'},
    {key:'uth', label:'Ultimate Texas Hold\u2019em'}
  ];
  var tagLabel = {bj:'BJ', bc:'BAC', pg:'PG', uth:'UTH', gen:'GEN'};
  sections.forEach(function(sec){
    var terms = TERMS.filter(function(t){ return t.tag===sec.key; });
    var sectionEl = document.createElement('div');
    sectionEl.className = 'term-section';
    var labelEl = document.createElement('p');
    labelEl.className = 'term-section-label';
    labelEl.textContent = sec.label;
    sectionEl.appendChild(labelEl);
    var gridEl = document.createElement('div');
    gridEl.className = 'term-grid';
    var cardsInSection = [];
    terms.forEach(function(t){
      var card = document.createElement('div');
      card.className = 'term-card';
      card.innerHTML = '<p class="term-name">'+t.name+' <span class="term-tag '+t.tag+'">'+tagLabel[t.tag]+'</span></p>'+
        '<p class="term-def">'+t.def+'</p>';
      gridEl.appendChild(card);
      var entry = {el:card, tag:t.tag, name:t.name.toLowerCase(), def:t.def.toLowerCase()};
      termCardEntries.push(entry);
      cardsInSection.push(entry);
    });
    sectionEl.appendChild(gridEl);
    container.appendChild(sectionEl);
    sectionEntries.push({el:sectionEl, cards:cardsInSection});
  });
}
renderGlossary();

var activeFilter = 'all';
function applyFilters(){
  var query = document.getElementById('search').value.trim().toLowerCase();
  var visibleCount = 0;
  termCardEntries.forEach(function(entry){
    var matchesFilter = activeFilter==='all' || entry.tag===activeFilter;
    var matchesSearch = !query || entry.name.indexOf(query)>=0 || entry.def.indexOf(query)>=0;
    var show = matchesFilter && matchesSearch;
    entry.el.classList.toggle('hidden', !show);
    if(show) visibleCount++;
  });
  sectionEntries.forEach(function(section){
    var anyVisible = section.cards.some(function(entry){ return !entry.el.classList.contains('hidden'); });
    section.el.style.display = anyVisible ? '' : 'none';
  });
  document.getElementById('no-results').style.display = visibleCount===0 ? 'block' : 'none';
}
document.getElementById('search').addEventListener('input', applyFilters);
document.querySelectorAll('.filter-btn').forEach(function(btn){
  btn.addEventListener('click', function(){
    document.querySelectorAll('.filter-btn').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    activeFilter = btn.getAttribute('data-filter');
    applyFilters();
  });
});
</script>
</body>
</html>
